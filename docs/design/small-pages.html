<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameMaster Small Pages Mock-up</title>
<!-- Design mock-up of the small pages (log-in card, profile, tickets,
     roleplay archive, status, audit log, crash report) in the cut-plate
     style (docs/branding.md). Not part of the app. Drawn at 1440x900
     (desktop) or 390x844 (phone). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Big+Shoulders+Stencil+Display:wght@800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --ink-950: oklch(11.8% 0.009 152); --ink-900: oklch(19.2% 0.011 152); --ink-800: oklch(26.6% 0.012 152);
    --ink-700: oklch(36.2% 0.013 152); --ink-600: oklch(44.4% 0.014 152); --ink-500: oklch(55.4% 0.015 152); --ink-400: oklch(70.4% 0.015 152);
    --ink-300: oklch(86.4% 0.012 152); --ink-100: oklch(96.6% 0.006 152);
    --brand-400: oklch(76.4% 0.186 146); --brand-950: oklch(19.4% 0.046 146);
    --mint: oklch(79.4% 0.118 174); --yellow: oklch(86% 0.15 95); --red: oklch(70% 0.17 22); --sky: oklch(76% 0.11 235);
    --display: "Big Shoulders Display", "Arial Narrow", sans-serif; --stencil: "Big Shoulders Stencil Display", var(--display); --body: "Public Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: oklch(8% 0.006 152); color: var(--ink-300); font: 400 14px/1.45 var(--body); font-variant-numeric: tabular-nums; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  svg.lucide { width: 16px; height: 16px; stroke-width: 1.75; flex: none; }
  .switches { flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; padding: 10px 16px; border-bottom: 1px solid var(--ink-800); background: var(--ink-950); }
  .switches h1 { margin: 0 6px 0 0; font: 800 22px/1 var(--display); text-transform: uppercase; color: var(--ink-100); }
  .seg { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-500); }
  .seg div { display: flex; border: 1px solid var(--ink-700); border-radius: 4px; overflow: hidden; }
  .seg button { padding: 5px 10px; font-size: 12px; font-weight: 600; color: var(--ink-400); }
  .seg button + button { border-left: 1px solid var(--ink-700); }
  .seg button[aria-pressed="true"] { background: var(--ink-800); color: var(--ink-100); }
  .seg.off { opacity: .35; pointer-events: none; }
  .viewport { flex: 1; min-height: 0; display: grid; place-items: center; padding: 16px; overflow: hidden; }
  .frame { position: relative; overflow: hidden; outline: 1px solid var(--ink-800); }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; background: var(--ink-950); }
  .stage.desk { width: 1440px; height: 900px; } .stage.phone { width: 390px; height: 844px; }
  .stage > div { height: 100%; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  .cut, .btn, .plate, .field { clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut)); }
  .cut, .btn, .field { --cut: 8px; }
  .plate { --cut: 14px; --line: var(--ink-800); background-color: var(--ink-900); }
  .plate, .field, .btn-secondary { border: 1px solid var(--line);
    background-image: linear-gradient(135deg, var(--line) calc(var(--cut) * .7071 + 1px), transparent 0), linear-gradient(315deg, var(--line) calc(var(--cut) * .7071 + 1px), transparent 0); background-origin: border-box; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 34px; padding: 0 13px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .btn-primary { background-color: var(--brand-400); color: var(--brand-950); }
  .btn-secondary { --line: var(--ink-700); color: var(--ink-100); background-color: var(--ink-950); }
  .btn-quiet { color: var(--ink-300); } .btn-icon { width: 34px; padding: 0; }
  .btn-sm { height: 30px; padding: 0 11px; font-size: 12.5px; --cut: 7px; }
  .btn-discord { background: #5865f2; color: #fff; }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 21px; padding: 0 11px; font-size: 11.5px; font-weight: 600; white-space: nowrap; clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 50%, calc(100% - 7px) 100%, 7px 100%, 0 50%); }
  .tag svg { width: 12px; height: 12px; }
  .dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .t { color: var(--c); background: color-mix(in oklab, var(--c) 16%, var(--ink-950)); }
  .t-ink { color: var(--ink-300); background: var(--ink-800); }
  .title { font-family: var(--display); font-weight: 800; text-transform: uppercase; line-height: .95; color: var(--ink-100); }
  .small { font-size: 12px; color: var(--ink-400); }
  .mark { width: 30px; height: 30px; --cut: 7px; display: grid; place-items: center; background: var(--brand-400); color: var(--brand-950); font: 800 17px/1 var(--stencil); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--ink-800); color: var(--ink-100); font-size: 12px; font-weight: 700; }
  .sicon { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; font: 700 14px/1 var(--body); color: #fff; }
  .top { flex: none; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border-bottom: 1px solid var(--ink-800); background: var(--ink-950); }
  .top .title { font-size: 26px; } .top small { display: block; font-size: 12px; color: var(--ink-400); }
  .top .end { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .phone .top { padding: 0 10px; } .phone .top .title { font-size: 20px; }
  .body { flex: 1; min-height: 0; overflow: hidden; display: flex; }
  .wrap { flex: 1; min-width: 0; overflow: hidden; padding: 20px 24px; }
  .phone .wrap { padding: 12px; }
  .center { max-width: 1060px; margin: 0 auto; }
  .h { display: flex; align-items: center; gap: 10px; } .h > svg { width: 20px; height: 20px; color: var(--brand-400); } .h .title { font-size: 30px; }
  .lead { margin: 4px 0 16px; font-size: 13px; color: var(--ink-400); }
  :root { --purple: oklch(72% 0.15 305); --gold: oklch(82% 0.13 85); --orange: oklch(76% 0.15 55); }
  .scroll { overflow-y: auto; }
  .narrow { max-width: 860px; margin: 0 auto; }
  .wide { max-width: 1240px; margin: 0 auto; }
  .row { display: flex; align-items: center; gap: 10px; }
  .muted { color: var(--ink-500); }
  .lbl2 { font-size: 13px; font-weight: 600; color: var(--ink-100); }
  .input { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; --cut: 7px; background: var(--ink-950); box-shadow: inset 0 0 0 1px var(--ink-700); font-size: 13px; color: var(--ink-500); }
  .input svg { color: var(--ink-500); } .input .chev { margin-left: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; --cut: 7px; background: var(--ink-900); font-size: 12.5px; font-weight: 600; color: var(--ink-300); white-space: nowrap; }
  .chip.on { background: var(--acc, var(--brand-400)); color: var(--ink-950); } .chip .c { font-size: 11px; opacity: .65; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  /* login */
  .gate { flex: 1; display: grid; place-items: center; padding: 24px; }
  .gcard { width: 440px; max-width: 100%; padding: 32px; text-align: center; display: flex; flex-direction: column; align-items: center; }
  .gcard .gi { width: 52px; height: 52px; --cut: 10px; display: grid; place-items: center; background: var(--ink-800); color: var(--brand-400); } .gcard .gi svg { width: 26px; height: 26px; }
  .gcard .title { font-size: 36px; margin-top: 16px; } .gcard p { margin: 8px 0 0; font-size: 13.5px; color: var(--ink-400); }
  .gsplit { flex: 1; display: grid; grid-template-columns: 1fr 460px; }
  .gsplit .l { padding: 72px 64px; border-right: 1px solid var(--ink-800); display: flex; flex-direction: column; justify-content: center; }
  .gsplit .l .title { font-size: 64px; } .gsplit .l .lead { font-size: 15px; max-width: 520px; margin: 12px 0 28px; }
  .gsplit .r { display: grid; place-items: center; padding: 32px; background: var(--ink-950); }
  .feat { display: flex; gap: 12px; padding: 12px 0; border-top: 1px solid var(--ink-800); max-width: 560px; } .feat svg { color: var(--brand-400); width: 20px; height: 20px; margin-top: 1px; }
  .feat b { display: block; color: var(--ink-100); font-size: 14px; } .feat span { font-size: 13px; color: var(--ink-400); }
  .phone .gsplit { grid-template-columns: 1fr; } .phone .gsplit .l { padding: 28px 18px 10px; border: 0; justify-content: flex-start; } .phone .gsplit .l .title { font-size: 42px; } .phone .gsplit .r { padding: 16px 18px 24px; align-items: start; }
  .who { display: flex; align-items: center; gap: 10px; padding: 10px 12px; --cut: 9px; background: var(--ink-950); margin-top: 18px; width: 100%; text-align: left; font-size: 12.5px; color: var(--ink-400); }
  /* profile */
  .phead { padding: 18px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .bigav { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: oklch(45% 0.1 250); color: #fff; font: 700 24px/1 var(--body); flex: none; }
  .phead .title { font-size: 38px; }
  .roles { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .rl { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; --cut: 5px; background: var(--ink-950); font-size: 11.5px; font-weight: 600; color: var(--ink-300); } .rl i { width: 8px; height: 8px; border-radius: 50%; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .phone .stats { grid-template-columns: repeat(2, 1fr); }
  .stat { padding: 12px; --cut: 9px; background: var(--ink-950); } .stat .v { font: 800 30px/1 var(--display); color: var(--ink-100); } .stat .k { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--ink-400); } .stat .k svg { width: 14px; height: 14px; }
  .sec { padding: 16px; } .sec h3 { margin: 0 0 10px; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--ink-100); } .sec h3 svg { color: var(--brand-400); }
  .two { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 12px; align-items: start; }
  .phone .two { grid-template-columns: 1fr; }
  .lrow { display: flex; align-items: center; gap: 10px; padding: 9px 10px; --cut: 7px; background: var(--ink-950); font-size: 13px; } .lrow + .lrow { margin-top: 4px; }
  .lrow .grow { flex: 1; min-width: 0; } .lrow .grow b { display: block; color: var(--ink-100); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .lrow .grow span { font-size: 11.5px; color: var(--ink-500); }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--ink-800); margin-bottom: 12px; overflow: hidden; }
  .tab { display: inline-flex; align-items: center; gap: 7px; height: 40px; padding: 0 14px; font-size: 13px; font-weight: 600; color: var(--ink-400); white-space: nowrap; }
  .tab.on { color: var(--ink-100); box-shadow: inset 0 -2px 0 var(--brand-400); } .tab.on svg { color: var(--brand-400); }
  .bar2 { height: 6px; background: var(--ink-800); margin-top: 6px; } .bar2 i { display: block; height: 100%; }
  /* tickets */
  .trows { display: grid; gap: 4px; }
  .trow { display: grid; grid-template-columns: 64px 180px minmax(0, 1fr) 110px 190px; align-items: center; gap: 12px; padding: 11px 14px; --cut: 8px; background: var(--ink-900); font-size: 13px; }
  .trow .no { font-variant-numeric: tabular-nums; color: var(--ink-500); } .trow b { color: var(--ink-100); font-weight: 600; } .trow .when { text-align: right; font-size: 12px; color: var(--ink-500); }
  .phone .trow { grid-template-columns: 1fr auto; gap: 4px 10px; } .phone .trow .hide { display: none; } .phone .trow .when { text-align: left; grid-column: 1 / -1; }
  .tcards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; } .phone .tcards { grid-template-columns: 1fr; }
  .tcard { padding: 14px; display: flex; flex-direction: column; gap: 8px; } .tcard b { font-size: 15px; color: var(--ink-100); font-weight: 600; }
  .msgs { padding: 6px 0; } .m { display: flex; gap: 12px; padding: 10px 16px; } .m + .m { border-top: 1px solid var(--ink-800); }
  .m .avatar { width: 36px; height: 36px; font-size: 14px; } .m .who2 { display: flex; align-items: baseline; gap: 8px; font-size: 13px; } .m .who2 b { color: var(--ink-100); } .m p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-300); }
  .embed { margin-top: 6px; padding: 9px 12px; --cut: 6px; background: var(--ink-950); box-shadow: inset 3px 0 0 #5865f2; font-size: 12.5px; max-width: 520px; } .embed b { color: var(--ink-100); }
  .file { display: inline-flex; align-items: center; gap: 8px; margin-top: 6px; height: 32px; padding: 0 11px; --cut: 7px; background: var(--ink-950); box-shadow: inset 0 0 0 1px var(--ink-700); font-size: 12.5px; color: var(--ink-100); }
  .botb { --cut: 3px; padding: 1px 5px; background: #5865f2; color: #fff; font-size: 10px; font-weight: 700; }
  /* roleplay */
  .hero { padding: 28px 30px; } .hero .title { font-size: 54px; max-width: 760px; } .hero p { max-width: 640px; color: var(--ink-400); font-size: 14px; margin: 10px 0 18px; }
  .phone .hero { padding: 18px; } .phone .hero .title { font-size: 36px; }
  .bigsearch { display: flex; align-items: center; gap: 10px; height: 48px; max-width: 680px; padding: 0 16px; --cut: 10px; background: var(--ink-950); box-shadow: inset 0 0 0 1px var(--ink-700); color: var(--ink-500); font-size: 15px; } .bigsearch svg { width: 18px; height: 18px; }
  .rpgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; } .phone .rpgrid { grid-template-columns: 1fr; }
  .rpc { padding: 16px; display: flex; flex-direction: column; gap: 8px; } .rpc .title { font-size: 24px; } .rpc q { font-size: 13px; font-style: italic; color: var(--ink-300); line-height: 1.5; }
  .rpc .pl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-300); } .rpc .pl .avatar { width: 22px; height: 22px; font-size: 10px; } .rpc .pl .grow { flex: 1; }
  .flag { width: 20px; height: 13px; flex: none; background: linear-gradient(var(--f1) 33%, var(--f2) 33% 66%, var(--f3) 66%); }
  .rpc .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--ink-800); display: flex; gap: 14px; font-size: 12px; color: var(--ink-400); } .rpc .foot span { display: inline-flex; align-items: center; gap: 5px; } .rpc .foot svg { width: 14px; height: 14px; }
  /* status */
  .banner { padding: 22px 24px; } .banner .title { font-size: 40px; }
  .pulse { width: 14px; height: 14px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 5px color-mix(in oklab, var(--mint) 22%, transparent); flex: none; }
  .uptime { display: flex; gap: 3px; height: 38px; margin-top: 12px; } .uptime i { flex: 1; background: var(--mint); } .uptime i.part { background: var(--yellow); } .uptime i.down { background: var(--red); }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; } .phone .facts { grid-template-columns: 1fr; }
  /* audit */
  .arow { display: grid; grid-template-columns: 22px 120px minmax(0, 1fr) 130px; gap: 12px; align-items: center; padding: 9px 12px; --cut: 7px; background: var(--ink-900); font-size: 13px; } .arow + .arow { margin-top: 3px; }
  .arow svg { color: var(--c); } .arow b { color: var(--ink-100); font-weight: 600; } .arow .when { text-align: right; font-size: 12px; color: var(--ink-500); }
  .phone .arow { grid-template-columns: 22px minmax(0, 1fr); } .phone .arow .hide { display: none; } .phone .arow .when { grid-column: 2; text-align: left; }
  .filters { flex: none; width: 272px; border-right: 1px solid var(--ink-800); background: var(--ink-950); padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; overflow: hidden; }
  .filters .item { height: 34px; }
  /* crash */
  .drop { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 26px; --cut: 12px; background: var(--ink-950); box-shadow: inset 0 0 0 1px var(--ink-700); text-align: center; font-size: 13px; color: var(--ink-400); } .drop svg { width: 28px; height: 28px; color: var(--brand-400); } .drop b { color: var(--ink-100); font-size: 14px; }
  .area { height: 96px; padding: 10px; --cut: 8px; background: var(--ink-950); box-shadow: inset 0 0 0 1px var(--ink-700); font-size: 13px; color: var(--ink-500); }
  .steprow { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 14px; } .steprow + .steprow { margin-top: 16px; }
  .sn { width: 32px; height: 32px; --cut: 7px; display: grid; place-items: center; background: var(--ink-800); color: var(--ink-100); font: 800 18px/1 var(--display); } .sn.on { background: var(--brand-400); color: var(--brand-950); } .sn.ok { background: color-mix(in oklab, var(--mint) 20%, var(--ink-900)); color: var(--mint); }
  .reward { display: flex; gap: 10px; padding: 12px; --cut: 9px; background: color-mix(in oklab, var(--gold) 9%, var(--ink-900)); box-shadow: inset 3px 0 0 var(--gold); font-size: 13px; } .reward svg { color: var(--gold); }
</style>
</head>
<body>
<div class="switches">
  <h1>Small pages mock-up</h1>
  <div class="seg">Page <div data-k="page"><button data-v="login">Log-in card</button><button data-v="profile">Profile</button><button data-v="tickets">Tickets</button><button data-v="ticket">A ticket</button><button data-v="rp">Roleplay archive</button><button data-v="status">Status</button><button data-v="audit">Audit log</button><button data-v="crash">Crash report</button></div></div>
  <div class="seg" id="opt"></div>
  <div class="seg">Size <div data-k="size"><button data-v="desk">Desktop</button><button data-v="phone">Phone</button></div></div>
</div>
<div class="viewport"><div class="frame" id="frame">
  <div class="stage desk" id="desk"><div data-screen></div></div>
  <div class="stage phone" id="phone" hidden><div data-screen-phone></div></div>
</div></div>
<script>
  // One switch per page: the choice that changes the most.
  const OPTIONS = {
    login: ["Log-in card", [["card", "Card in the middle (today)"], ["split", "What's here + log in"]]],
    profile: ["Layout", [["record", "Like a Database record"], ["tabs", "Tabs"]]],
    tickets: ["List", [["rows", "Rows"], ["cards", "Cards"]]],
    ticket: null,
    rp: ["Accent", [["purple", "Purple for roleplay"], ["green", "Green like the rest"]]],
    status: ["Top", [["banner", "Big status plate"], ["quiet", "Quiet line, uptime first"]]],
    audit: ["Filters", [["top", "On top (today)"], ["side", "List on the left"]]],
    crash: ["Form", [["one", "One form"], ["steps", "Three numbered steps"]]],
  };
  const state = { page: "login", size: "desk", login: "split", profile: "record", tickets: "rows", rp: "purple", status: "banner", audit: "side", crash: "steps" };
  const phone = () => state.size === "phone";
  const topBar = (title, sub, extra = "") => `<header class="top"><span class="mark cut">GM</span><div style="min-width:0"><div class="title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${title}</div>${phone() ? "" : `<small>${sub}</small>`}</div>${phone() ? "" : extra}<div class="end">${phone() ? "" : '<span class="avatar">D</span>'}<button class="btn btn-quiet ${phone() ? "btn-icon" : ""}"><i data-lucide="menu"></i>${phone() ? "" : "Menu"}</button></div></header>`;
  const discord = `<button class="btn btn-discord" style="height:42px;padding:0 20px;font-size:14px;--cut:9px"><svg width="20" height="16" viewBox="0 0 71 55" fill="currentColor"><path d="M60.1 4.9A58.5 58.5 0 0 0 45.5.4a40.8 40.8 0 0 0-2 3.8 54 54 0 0 0-16.2 0A37.4 37.4 0 0 0 25.4.5 58.4 58.4 0 0 0 10.6 5C1.5 18.7-1 32.1.3 45.4a58.8 58.8 0 0 0 18 9.1 42 42 0 0 0 3.6-5.9 38.7 38.7 0 0 1-5.6-2.7l1.3-1a42 42 0 0 0 35.6 0l1.3 1a36.3 36.3 0 0 1-5.6 2.7 47.2 47.2 0 0 0 3.6 5.9 58.6 58.6 0 0 0 18-9.1c1.5-15.4-2.5-28.7-10.5-40.5ZM23.7 37.3c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.5 3.3 6.4 7.2-2.8 7.2-6.4 7.2Zm23.6 0c-3.5 0-6.4-3.2-6.4-7.2s2.8-7.2 6.4-7.2 6.5 3.3 6.4 7.2-2.8 7.2-6.4 7.2Z"/></svg>Log in with Discord</button>`;
  const page = (title, sub, body, extra = "") => topBar(title, sub, extra) + `<div class="body"><div class="wrap scroll">${body}</div></div>`;
  const flag = (a, b, c) => `<span class="flag" style="--f1:${a};--f2:${b};--f3:${c}"></span>`;

  function login() {

  function crash() {
    const gameBox = `<div class="plate" style="padding:16px 18px;display:flex;align-items:center;gap:12px"><span class="gi cut" style="width:40px;height:40px;--cut:8px;display:grid;place-items:center;background:var(--ink-800);color:var(--brand-400)"><i data-lucide="gamepad-2"></i></span><div style="flex:1;min-width:0"><b style="color:var(--ink-100)">Road to 56, Sunday RP</b><div class="small">On-going, you play Germany</div></div><span class="tag dot t" style="--c:var(--sky)">On-going</span></div>`;
    const reward = `<div class="reward cut"><i data-lucide="medal"></i><div><b style="color:var(--ink-100)">2 Merit for your report</b><div class="small">1 Merit if you're not Verified yet. The mod developers get the zip; the bot checks it first.</div></div></div>`;
    const drop = `<div class="drop"><i data-lucide="file-archive"></i><b>Drop your crash zip here</b>or pick the file. Zip the whole crash folder, 500 KB to 15 MB.<button class="btn btn-secondary btn-sm" style="margin-top:6px"><i data-lucide="folder-open"></i>Pick a file</button></div>`;
    const what = `<div><div class="lbl2" style="margin-bottom:6px">What happened</div><div class="area">The game froze when Italy declared war on Yugoslavia, then closed.</div></div>`;
    const notes = `<div><div class="lbl2" style="margin-bottom:6px">Anything else <span class="small">(optional)</span></div><div class="area" style="height:60px">Mods, when it started</div></div>`;
    const send = `<div class="row"><span class="small grow" style="flex:1">The report goes to the crash-report channel.</span><button class="btn btn-primary"><i data-lucide="send"></i>Send crash report</button></div>`;
    let form;
    if (state.crash === "one") {
      form = `<div class="plate" style="padding:18px;display:grid;gap:14px">${drop}${what}${notes}${send}</div>`;
    } else {
      const step = (n, cls, title, help, inner) => `<div class="steprow"><span class="sn cut ${cls}">${cls === "ok" ? '<i data-lucide="check"></i>' : n}</span><div><div class="lbl2" style="font-size:15px">${title}</div><div class="small" style="margin:2px 0 10px">${help}</div>${inner}</div></div>`;
      form = `<div class="plate" style="padding:20px">${step(1, "ok", "Find the crash folder", "Documents, Paradox Interactive, Hearts of Iron IV, crashes. Zip the newest folder.", "")}${step(2, "on", "Add the zip", "The whole folder, with the minidump and the logs.", drop)}${step(3, "", "Say what happened", "What you were doing when it crashed.", `<div style="display:grid;gap:10px">${what}${notes}${send}</div>`)}</div>`;
    }
    return page("Report a crash", "Send your crash logs to the mod developers", `<div class="narrow" style="display:grid;gap:12px"><div class="h"><i data-lucide="siren"></i><span class="title">Report a crash</span></div>${gameBox}${reward}${form}</div>`);
  }

    const opt = OPTIONS[state.page];
    const seg = document.getElementById("opt");
    seg.innerHTML = opt ? `${opt[0]} <div data-k="${state.page}">${opt[1].map(([v, l]) => `<button data-v="${v}">${l}</button>`).join("")}</div>` : "";
    document.querySelectorAll(".seg > div").forEach((s) => s.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(state[s.dataset.k] === b.dataset.v))));
    const html = { login, profile, tickets, ticket, rp, status, audit, crash }[state.page]();
    document.querySelector(state.size === "desk" ? "[data-screen]" : "[data-screen-phone]").innerHTML = `<div class="${state.size}" style="height:100%;display:flex;flex-direction:column">${html}</div>`;
    document.getElementById("desk").hidden = state.size !== "desk";
    document.getElementById("phone").hidden = state.size !== "phone";
    lucide.createIcons();
    fit();
  }
  function fit() {
    const stage = document.getElementById(state.size);
    const w = state.size === "desk" ? 1440 : 390, h = state.size === "desk" ? 900 : 844;
    const vp = document.querySelector(".viewport");
    const s = Math.min((vp.clientWidth - 32) / w, (vp.clientHeight - 32) / h, state.size === "desk" ? 1 : 1.2);
    stage.style.transform = `scale(${s})`;
    const frame = document.getElementById("frame"); frame.style.width = `${w * s}px`; frame.style.height = `${h * s}px`;
  }
  document.querySelector(".switches").addEventListener("click", (e) => { const b = e.target.closest(".seg button"); if (!b) return; state[b.parentElement.dataset.k] = b.dataset.v; render(); });
  addEventListener("resize", fit);
  render();
</script>
</body>
</html>
